packages:
  - packages/*
overrides:
  # GHSA-2v37-7h3g-55p8 — nanoid < 3.3.18 loops indefinitely for a zero size.
  # Reaches the tree only as depcheck -> @vue/compiler-sfc -> postcss -> nanoid,
  # so it is build-time only and never ships to consumers. depcheck 1.4.7 is its
  # own latest release, so there is no parent left to bump.
  # Drop this once depcheck resolves a patched nanoid on its own.
  nanoid: '^6.0.0'

  # CVE-2026-75899 / CVE-2026-75931 / CVE-2026-75975 / CVE-2026-76172 — fast-uri
  # < 3.1.6 mis-normalizes URIs (host confusion, SSRF via malformed IPv6 and
  # repeated percent-decoding, skipped IDN canonicalization).
  # Reaches the tree only as @commitlint/cli -> @commitlint/config-validator ->
  # ajv -> fast-uri, so it is commit-lint-time only and never ships to consumers.
  # ajv 8.20.0 is its own latest release and still asks for fast-uri ^3.0.1, so
  # there is no parent left to bump.
  # Drop this once ajv resolves a patched fast-uri on its own.
  fast-uri: '^3.1.6'

# Supply-chain soak: refuse packages published less than 24h ago, so a compromised
# release has a window to be caught and unpublished before it reaches a build.
#
# This must live here, not in .npmrc. pnpm only auto-enables STRICT soak mode when
# the setting comes from pnpm-workspace.yaml / config.yaml / CLI / env; a value in
# .npmrc runs in LOOSE mode, where a too-young package is silently appended to
# minimumReleaseAgeExclude and installed anyway. minimumReleaseAgeStrict is set
# explicitly so the enforcement does not depend on that inference.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
